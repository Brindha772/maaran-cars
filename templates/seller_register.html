<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Seller Registration | The Maaran Cars</title>

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <!-- Form-specific stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/forms.css') }}"
    >
</head>

<body class="form-page">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">

        <a
            class="brand"
            href="{{ url_for('home') }}"
        >
            the maaran cars
        </a>

        <a
            class="text-link"
            href="{{ url_for('home') }}"
        >
            Back home &#8592;
        </a>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="registration-shell">

        <!-- Registration introduction -->
        <section class="registration-intro">

            <p class="eyebrow">
                Seller registration
            </p>

            <h1>
                Let’s find your car
                <br>
                <em>a new home.</em>
            </h1>

            <p>
                Give us the details of your vehicle and
                our team will be in touch.
            </p>

        </section>


        <!-- =========================
             SELLER REGISTRATION FORM
        ========================== -->
        <form
            class="registration-form"
            method="post"
            action="{{ url_for('register_seller') }}"
        >

            <!-- Form title -->
            <div class="form-title">

                <span>02</span>

                <h2>
                    Vehicle details
                </h2>

            </div>


            <!-- Server-side error message -->
            {% if error %}

                <p class="server-error">
                    {{ error }}
                </p>

            {% endif %}


            <!-- =========================
                 FORM FIELDS
            ========================== -->
            <div class="field-grid">

                <!-- Name -->
                <label>
                    Name *

                    <input
                        name="name"
                        type="text"
                        value="{{ values.name|default('') }}"
                        required
                    >
                </label>


                <!-- Car Name -->
                <label>
                    Car name *

                    <input
                        name="car_name"
                        type="text"
                        value="{{ values.car_name|default('') }}"
                        required
                    >
                </label>


                <!-- Car Model -->
                <label>
                    Car model *

                    <input
                        name="car_model"
                        type="text"
                        value="{{ values.car_model|default('') }}"
                        required
                    >
                </label>


                <!-- Car Variant -->
                <label>
                    Car variant

                    <input
                        name="car_variant"
                        type="text"
                        value="{{ values.car_variant|default('') }}"
                    >
                </label>


                <!-- Manufacturing Year -->
                <label>
                    Year

                    <input
                        name="year"
                        type="text"
                        value="{{ values.year|default('') }}"
                    >
                </label>


                <!-- Fuel -->
                <label>
                    Fuel

                    <input
                        name="fuel"
                        type="text"
                        value="{{ values.fuel|default('') }}"
                        placeholder="Petrol / Diesel"
                    >
                </label>


                <!-- Transmission -->
                <label>
                    Transmission

                    <input
                        name="transmission"
                        type="text"
                        value="{{ values.transmission|default('') }}"
                        placeholder="Manual / Automatic"
                    >
                </label>


                <!-- Ownership -->
                <label>
                    Ownership

                    <input
                        name="ownership"
                        type="text"
                        value="{{ values.ownership|default('') }}"
                    >
                </label>


                <!-- Kilometers Driven -->
                <label>
                    Km driven

                    <input
                        name="km_driven"
                        type="text"
                        value="{{ values.km_driven|default('') }}"
                    >
                </label>


                <!-- Insurance -->
                <label>
                    Insurance

                    <input
                        name="insurance"
                        type="text"
                        value="{{ values.insurance|default('') }}"
                    >
                </label>


                <!-- Place -->
                <label>
                    Place

                    <input
                        name="place"
                        type="text"
                        value="{{ values.place|default('') }}"
                    >
                </label>


                <!-- Expected Price -->
                <label>
                    Expecting price

                    <input
                        name="expecting_price"
                        type="text"
                        value="{{ values.expecting_price|default('') }}"
                    >
                </label>


                <!-- Dents -->
                <label>
                    Any dents

                    <input
                        name="dents"
                        type="text"
                        value="{{ values.dents|default('') }}"
                        placeholder="Yes / No"
                    >
                </label>


                <!-- Scratches -->
                <label>
                    Any scratches

                    <input
                        name="scratches"
                        type="text"
                        value="{{ values.scratches|default('') }}"
                        placeholder="Yes / No"
                    >
                </label>

            </div>


            <!-- =========================
                 SUBMIT BUTTON
            ========================== -->
            <button
                class="button button-coral form-submit"
                type="submit"
            >
                Submit seller registration

                <span>
                    &#8599;
                </span>
            </button>

        </form>

    </main>

</body>

</html>
